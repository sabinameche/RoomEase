<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group - RoomEase</title>
<link rel="stylesheet" href="../css/group.css">
<link rel="stylesheet" href="../css/group_popup.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
<div class="logo">🏠 RoomEase</div>

<nav>
<a href="http://127.0.0.1:5501/RoomEase/frontend/html/dashboard.html">Dashboard</a>
<a href="#" class="active">Groups</a>
<a href="#">Profile</a>
</nav>
</header>

<div class="container">

<div id ="groupInfo"></div>

<!-- GROUP MEMBERS -->
<div class="card"></div>

<!-- BALANCE -->
<div class="card">
<h2>Balances</h2>
<div id="balance-container">
    <!-- dynamically add the user balances -->
</div>
</div>


<!-- ADD EXPENSE -->
<div class="card">

<div class="card-header">
<h2>Expenses</h2>
<button class="primary-btn small" id = "addExpense">+ Add Expense</button>
</div>
<div id = "expense-list">
    <!-- dynamiically add the expense details+ -->
</div>

</div>

</div>
<div id="modalGroupContainer"></div>
<div id = "modalExpenseContainer"></div>

<script>
async function loadModal() {
    const res = await fetch('../html/group_modal.html');
    const html = await res.text();
    document.getElementById('modalGroupContainer').innerHTML = html;
}
async function loadExpenseModal(){
    const res = await fetch('../html/expense_modal.html');
    const html = await res.text();
    document.getElementById('modalExpenseContainer').innerHTML = html;
}

loadModal();
loadExpenseModal();
</script>


<script type= "module" src="../js/group.js"></script>
<script type = "module" src="../js/expense.js"></script>
</body>
</html>
