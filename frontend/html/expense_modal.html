<!-- Expense MODAL -->
<link rel="stylesheet" href="../css/expense_modal.css">
<div id="expenseModal" class="expense-modal">

    <div class="expense-modal-content">

        <div class="expense-modal-header">
            <h2 id="expense-header-title">Create Expense</h2>
            <span class="close-expense-btn" id = "closeExpenseBtn">&times;</span>
        </div>

        <div class="expense-modal-body">

            <div id = "expense-title">
            <label>Title</label>
            <input type="text" id ="expense-name" placeholder="Expenses">
            </div>
            <div class = 'second-row'>

                <div id = "Amount-label">
                <label>Amount</label>
                <input type="number" id = "expense-amount" placeholder="0">
                </div>

                <div id = 'date-label'>
                <label>Date</label>
                <input type = "date" id="expense-date">
                </div>
            </div>

            <div class ='third-row'>

                <div id="expense-category">
                <label>Category</label>
                <select id = "expenseCategory">
                    <option value = "RENT">Rent</option>
                    <option  value = "GROCERIES">Groceries</option>
                    <option value = "UTILITIES">Utilities</option>
                    <option value = "INTERNET">Internet</option>
                    <option value = "TRANSPORT">Transport</option>
                    <option value = "OTHER">Other</option>
                </select>
                </div>
                <div id = 'paid-by'>
                <label>Paid by</label>
                <select class = 'paid-by-list' id = 'paid_by_list'>
                    <!-- dynamically add the options -->
                    <option class = 'paid-by-member'></option>
                </select>
                </div>
                </div>
            <div class = 'last-row'>
                <div id = "expense-split">
                    <label>Split Type</label>
                    <select id="split-amount">
                    <option value = "EQUAL">Equal</option>
                    <option value = "PERCENTAGE">Percentage</option>
                    <option value = "EXACT">Exact</option>
                    </select>
                    </div>
                    
                    <div id = 'select-participants'>
                    <label>Select Participants</label>
                    <div class="participants-list"></div>
                    </div>
                
            </div>

            <button class="add-expense-btn" id="createExpense">Add Expense</button>
            <button class="edit-expense-btn" id="editExpense" display ='none'>Edit Expense</button>
        </div>

    </div>

</div>
